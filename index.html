<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio/Video Sync Tool</title>
    <script src="coi-serviceworker.js"></script>
    <script src="vendor/ffmpeg/ffmpeg.js"></script>
    <style>
      body {
        background-color: #000;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        color: #fff;
      }

      .media-container {
        max-width: 100%;
        width: 720px;
        background: #111;
        padding: 20px;
        border-radius: 16px;
        box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
      }

      h1 {
        margin: 0 0 20px 0;
        font-size: 22px;
        color: #4a9eff;
        text-align: center;
      }

      video {
        width: 100%;
        border-radius: 8px;
        background-color: #000;
      }

      .file-inputs {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 20px;
      }

      .file-input-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .file-input-row label {
        min-width: 60px;
        color: #aaa;
        font-size: 14px;
      }

      input[type="file"] {
        flex: 1;
        background: #222;
        color: #fff;
        border: 1px solid #555;
        padding: 5px;
        border-radius: 6px;
      }

      .file-name {
        font-size: 12px;
        color: #777;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 200px;
      }

      .controls-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 15px;
      }

      button {
        background: #333;
        color: #fff;
        border: 1px solid #555;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }

      button:hover:not(:disabled) {
        background: #444;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      button.primary {
        background: #4a9eff;
        color: #000;
        border-color: #4a9eff;
        font-weight: bold;
      }

      button.primary:hover:not(:disabled) {
        background: #6bb3ff;
      }

      .offset-section {
        margin-top: 15px;
        background: #222;
        border-radius: 8px;
        padding: 15px;
      }

      .offset-section label {
        display: block;
        margin-bottom: 8px;
        color: #4a9eff;
        font-size: 14px;
      }

      .offset-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .offset-controls input[type="number"] {
        width: 120px;
        padding: 8px;
        font-size: 16px;
        background: #111;
        color: #fff;
        border: 1px solid #555;
        border-radius: 6px;
      }

      .offset-hint {
        font-size: 12px;
        color: #777;
        margin-top: 8px;
      }

      .queue-container {
        margin-top: 15px;
        background: #222;
        border-radius: 8px;
        padding: 15px;
      }

      .queue-container h3 {
        margin: 0 0 10px 0;
        font-size: 16px;
        color: #4a9eff;
      }

      .queue-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .queue-item {
        background: #333;
        padding: 10px;
        margin-bottom: 5px;
        border-radius: 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: move;
        user-select: none;
        transition: background 0.2s;
      }

      .queue-item:hover {
        background: #444;
      }

      .queue-item.dragging {
        opacity: 0.5;
      }

      .queue-item.drag-over {
        border-top: 2px solid #4a9eff;
      }

      .queue-item.playing {
        background: #4a9eff;
        color: #000;
        font-weight: bold;
      }

      .queue-item-name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        margin-right: 10px;
      }

      .queue-item button {
        background: #555;
        color: #fff;
        border: none;
        padding: 5px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
      }

      .queue-item button:hover {
        background: #777;
      }

      .queue-item.playing button {
        background: #000;
        color: #fff;
      }

      .queue-empty {
        color: #777;
        font-style: italic;
        text-align: center;
        padding: 20px;
      }

      .waveform-section {
        margin-top: 20px;
      }

      .waveform-label {
        font-size: 13px;
        color: #aaa;
        margin-bottom: 4px;
      }

      .waveform-container {
        position: relative;
        width: 100%;
        margin-bottom: 15px;
      }

      .waveform-canvas {
        width: 100%;
        height: 80px;
        background: #111;
        display: block;
        cursor: pointer;
        border-radius: 4px;
      }

      .progress-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 80px;
        pointer-events: none;
        border-radius: 4px;
      }

      .export-section {
        margin-top: 20px;
        text-align: center;
      }

      #statusText {
        margin-top: 10px;
        font-size: 13px;
        color: #aaa;
        min-height: 18px;
      }

      #statusText.error {
        color: #ff6b6b;
      }
    </style>
  </head>
  <body>
    <div class="media-container">
      <h1>Audio/Video Sync Tool</h1>

      <video id="videoPlayer" controls></video>

      <div class="file-inputs">
        <div class="file-input-row">
          <label for="videoInput">Video:</label>
          <input type="file" id="videoInput" accept="video/*" multiple />
        </div>
        <div class="file-input-row">
          <label for="audioInput">Audio:</label>
          <input type="file" id="audioInput" accept="audio/*" />
          <span class="file-name" id="audioFileName">No file selected</span>
        </div>
      </div>

      <div class="queue-container">
        <h3>Video queue</h3>
        <ul class="queue-list" id="queueList">
          <li class="queue-empty">
            No videos in queue. Select one or more video files to add them.
          </li>
        </ul>
      </div>

      <div class="controls-row">
        <button type="button" id="muteToggle">Mute video audio</button>
      </div>

      <div class="offset-section">
        <label for="offsetControl">Audio offset (seconds)</label>
        <div class="offset-controls">
          <button type="button" id="offsetMinus1">−1s</button>
          <button type="button" id="offsetMinus01">−0.1s</button>
          <input type="number" id="offsetControl" step="0.01" value="0" />
          <button type="button" id="offsetPlus01">+0.1s</button>
          <button type="button" id="offsetPlus1">+1s</button>
        </div>
        <p class="offset-hint">
          Positive = external audio starts later (matches ffmpeg -itsoffset).
          Offset applies to the combined timeline when multiple videos are queued.
        </p>
      </div>

      <div class="waveform-section">
        <div class="waveform-label">External audio</div>
        <div class="waveform-container">
          <canvas id="audioWaveform" class="waveform-canvas"></canvas>
          <canvas id="audioProgress" class="progress-overlay"></canvas>
        </div>
      </div>

      <div class="export-section">
        <button type="button" id="syncDownload" class="primary" disabled>
          Sync and Download
        </button>
        <div id="statusText"></div>
      </div>
    </div>

    <audio id="audioPlayer" hidden></audio>

    <script>
      const videoInput = document.getElementById("videoInput");
      const audioInput = document.getElementById("audioInput");
      const audioFileName = document.getElementById("audioFileName");
      const videoPlayer = document.getElementById("videoPlayer");
      const audioPlayer = document.getElementById("audioPlayer");
      const muteToggle = document.getElementById("muteToggle");
      const offsetControl = document.getElementById("offsetControl");
      const syncDownload = document.getElementById("syncDownload");
      const statusText = document.getElementById("statusText");
      const queueList = document.getElementById("queueList");

      const audioCanvas = document.getElementById("audioWaveform");
      const audioCtx2d = audioCanvas.getContext("2d");
      const audioProgressCanvas = document.getElementById("audioProgress");
      const audioProgressCtx = audioProgressCanvas.getContext("2d");

      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      let videoQueue = [];
      let currentQueueIndex = -1;
      let clipStartOffset = 0;
      let draggedIndex = null;

      let audioFile = null;
      let audioUrl = null;
      let externalAudioBuffer = null;
      let videoMuted = false;

      let ffmpegInstance = null;
      let ffmpegLoadPromise = null;
      let isExporting = false;

      const ts = () => `[${new Date().toISOString()}]`;

      function ffmpegAsset(file) {
        return new URL(`vendor/ffmpeg/${file}`, document.baseURI || window.location.href).href;
      }

      function safeFfmpegInputName(originalName, fallback) {
        const ext = originalName.includes(".")
          ? originalName.slice(originalName.lastIndexOf("."))
          : fallback;
        return "input" + ext.replace(/[^a-zA-Z0-9.]/g, "");
      }

      function queueMountName(index, file) {
        const ext = file.name.includes(".")
          ? file.name.slice(file.name.lastIndexOf(".")).replace(/[^a-zA-Z0-9.]/g, "")
          : ".mp4";
        return `video${index}${ext}`;
      }

      function getOffset() {
        const val = parseFloat(offsetControl.value);
        return isNaN(val) ? 0 : val;
      }

      function setStatus(message, isError) {
        statusText.textContent = message;
        statusText.className = isError ? "error" : "";
      }

      function updateSyncButton() {
        syncDownload.disabled = videoQueue.length === 0 || !audioFile || isExporting;
      }

      function getClipStartOffset(index) {
        let sum = 0;
        for (let i = 0; i < index; i++) {
          sum += videoQueue[i].duration || 0;
        }
        return sum;
      }

      function getTotalDuration() {
        return videoQueue.reduce((sum, item) => sum + (item.duration || 0), 0);
      }

      function getGlobalVideoTime() {
        return clipStartOffset + (videoPlayer.currentTime || 0);
      }

      function probeDuration(url) {
        return new Promise((resolve) => {
          const v = document.createElement("video");
          v.preload = "metadata";
          v.onloadedmetadata = () => {
            const duration = Number.isFinite(v.duration) ? v.duration : 0;
            v.removeAttribute("src");
            v.load();
            resolve(duration);
          };
          v.onerror = () => resolve(0);
          v.src = url;
        });
      }

      function updateQueueDisplay() {
        queueList.innerHTML = "";

        if (videoQueue.length === 0) {
          queueList.innerHTML =
            '<li class="queue-empty">No videos in queue. Select one or more video files to add them.</li>';
          return;
        }

        videoQueue.forEach((item, index) => {
          const li = document.createElement("li");
          li.className =
            "queue-item" + (index === currentQueueIndex ? " playing" : "");
          li.draggable = true;
          li.dataset.index = index;

          const nameSpan = document.createElement("span");
          nameSpan.className = "queue-item-name";
          nameSpan.textContent = item.name;

          const removeBtn = document.createElement("button");
          removeBtn.textContent = "Remove";
          removeBtn.onclick = () => removeFromQueue(index);

          li.addEventListener("dragstart", handleDragStart);
          li.addEventListener("dragend", handleDragEnd);
          li.addEventListener("dragover", handleDragOver);
          li.addEventListener("drop", handleDrop);
          li.addEventListener("dragleave", handleDragLeave);
          li.addEventListener("dblclick", () => loadQueueItem(index, true));

          li.appendChild(nameSpan);
          li.appendChild(removeBtn);
          queueList.appendChild(li);
        });
      }

      function handleDragStart(e) {
        draggedIndex = parseInt(e.currentTarget.dataset.index, 10);
        e.currentTarget.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
      }

      function handleDragEnd(e) {
        e.currentTarget.classList.remove("dragging");
        document.querySelectorAll(".queue-item").forEach((item) => {
          item.classList.remove("drag-over");
        });
      }

      function handleDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        const targetIndex = parseInt(e.currentTarget.dataset.index, 10);
        if (targetIndex !== draggedIndex) {
          e.currentTarget.classList.add("drag-over");
        }
      }

      function handleDragLeave(e) {
        e.currentTarget.classList.remove("drag-over");
      }

      function handleDrop(e) {
        e.stopPropagation();
        e.preventDefault();

        const targetIndex = parseInt(e.currentTarget.dataset.index, 10);

        if (draggedIndex !== null && draggedIndex !== targetIndex) {
          const draggedItem = videoQueue[draggedIndex];
          videoQueue.splice(draggedIndex, 1);
          videoQueue.splice(targetIndex, 0, draggedItem);

          if (currentQueueIndex === draggedIndex) {
            currentQueueIndex = targetIndex;
          } else if (draggedIndex < currentQueueIndex && targetIndex >= currentQueueIndex) {
            currentQueueIndex--;
          } else if (draggedIndex > currentQueueIndex && targetIndex <= currentQueueIndex) {
            currentQueueIndex++;
          }

          if (currentQueueIndex >= 0) {
            clipStartOffset = getClipStartOffset(currentQueueIndex);
          }

          updateQueueDisplay();
          redrawExternalWaveform();
        }
      }

      function removeFromQueue(index) {
        revokeUrl(videoQueue[index].url);
        videoQueue.splice(index, 1);

        if (index === currentQueueIndex) {
          if (videoQueue.length > 0) {
            currentQueueIndex = Math.min(index, videoQueue.length - 1);
            loadQueueItem(currentQueueIndex, true);
          } else {
            currentQueueIndex = -1;
            clipStartOffset = 0;
            videoPlayer.removeAttribute("src");
            videoPlayer.load();
          }
        } else {
          if (index < currentQueueIndex) {
            currentQueueIndex--;
          }
          if (currentQueueIndex >= 0) {
            clipStartOffset = getClipStartOffset(currentQueueIndex);
          }
        }

        updateQueueDisplay();
        redrawExternalWaveform();
        updateSyncButton();
      }

      function loadQueueItem(index, autoplay) {
        if (index < 0 || index >= videoQueue.length) return;

        currentQueueIndex = index;
        clipStartOffset = getClipStartOffset(index);
        const item = videoQueue[index];

        videoPlayer.src = item.url;
        videoPlayer.load();
        videoPlayer.muted = videoMuted;

        updateQueueDisplay();

        videoPlayer.onloadedmetadata = () => {
          if (Number.isFinite(videoPlayer.duration)) {
            item.duration = videoPlayer.duration;
          }
          redrawExternalWaveform();
        };

        if (autoplay) {
          videoPlayer.play().catch((err) =>
            console.warn("Video play blocked:", err)
          );
        }

        syncAudioToVideo();
      }

      function playNext() {
        if (currentQueueIndex < videoQueue.length - 1) {
          loadQueueItem(currentQueueIndex + 1, true);
        }
      }

      function seekToGlobalTime(globalTime) {
        if (videoQueue.length === 0) return;

        const total = getTotalDuration();
        if (total > 0) {
          let accumulated = 0;
          for (let i = 0; i < videoQueue.length; i++) {
            const dur = videoQueue[i].duration || 0;
            if (dur > 0 && globalTime < accumulated + dur) {
              const wasPlaying = !videoPlayer.paused;
              loadQueueItem(i, false);
              videoPlayer.currentTime = Math.max(0, globalTime - accumulated);
              if (wasPlaying) {
                videoPlayer.play().catch(() => {});
              }
              syncAudioToVideo();
              return;
            }
            accumulated += dur;
          }
          const last = videoQueue.length - 1;
          loadQueueItem(last, false);
          if (videoPlayer.duration) {
            videoPlayer.currentTime = videoPlayer.duration;
          }
          syncAudioToVideo();
          return;
        }

        if (currentQueueIndex < 0) {
          loadQueueItem(0, false);
        }
        videoPlayer.currentTime = Math.max(0, globalTime);
        syncAudioToVideo();
      }

      function resizeCanvas() {
        const rect = audioCanvas.getBoundingClientRect();
        const width = rect.width || 1;
        const height = rect.height || 1;
        audioCanvas.width = width;
        audioCanvas.height = height;
        audioProgressCanvas.width = width;
        audioProgressCanvas.height = height;

        if (externalAudioBuffer) {
          redrawExternalWaveform();
        }
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      function drawWaveformToCanvas(canvas, ctx, audioBuffer, shiftPx) {
        const sampleCount = canvas.width;
        if (sampleCount <= 0) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const channelData = audioBuffer.getChannelData(0);
        const blockSize = Math.max(1, Math.floor(channelData.length / sampleCount));
        const waveform = new Float32Array(sampleCount);

        for (let i = 0; i < sampleCount; i++) {
          let sum = 0;
          const start = i * blockSize;
          const end = Math.min(start + blockSize, channelData.length);
          for (let j = start; j < end; j++) {
            sum += Math.abs(channelData[j]);
          }
          waveform[i] = sum / (end - start || 1);
        }

        ctx.fillStyle = "#4a9eff";
        const midY = canvas.height / 2;
        const halfHeight = canvas.height / 2;
        const amplification = 7;

        for (let x = 0; x < waveform.length; x++) {
          const drawX = x + shiftPx;
          if (drawX < 0 || drawX >= canvas.width) continue;

          const v = waveform[x];
          const barHeight = Math.min(v * halfHeight * amplification, halfHeight);
          ctx.fillRect(drawX, midY - barHeight, 1, barHeight * 2);
        }
      }

      function drawFlatFallback(canvas, ctx) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#4a9eff";
        const midY = canvas.height / 2;
        const barHeight = canvas.height * 0.15;
        ctx.fillRect(0, midY - barHeight, canvas.width, barHeight * 2);
        ctx.font = "12px Arial";
        ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
        ctx.fillText("Waveform unavailable", 8, 18);
      }

      function getExternalWaveformShiftPx() {
        const total = getTotalDuration();
        if (!total || !externalAudioBuffer) return 0;
        return (getOffset() / total) * audioCanvas.width;
      }

      function redrawExternalWaveform() {
        if (!externalAudioBuffer) return;
        drawWaveformToCanvas(
          audioCanvas,
          audioCtx2d,
          externalAudioBuffer,
          getExternalWaveformShiftPx()
        );
      }

      async function getFFmpeg() {
        if (ffmpegInstance) return ffmpegInstance;
        if (ffmpegLoadPromise) return ffmpegLoadPromise;

        ffmpegLoadPromise = (async () => {
          const { FFmpeg } = FFmpegWASM;
          const coreURL = ffmpegAsset("ffmpeg-core.js");
          const wasmURL = ffmpegAsset("ffmpeg-core.wasm");

          const ff = new FFmpeg();
          ff.on("log", ({ message }) => console.log(ts(), "[ffmpeg wasm]", message));

          await ff.load({ coreURL, wasmURL });
          ffmpegInstance = ff;
          ffmpegLoadPromise = null;
          return ff;
        })();

        return ffmpegLoadPromise;
      }

      async function decodeAudioBuffer(arrayBuffer) {
        if (audioCtx.state === "suspended") await audioCtx.resume();
        return audioCtx.decodeAudioData(arrayBuffer);
      }

      async function renderExternalWaveform() {
        resizeCanvas();
        if (!audioFile || !audioUrl) return;

        try {
          const arrayBuffer = await fetch(audioUrl).then((r) => r.arrayBuffer());
          externalAudioBuffer = await decodeAudioBuffer(arrayBuffer);
          redrawExternalWaveform();
        } catch (err) {
          console.warn(ts(), "[waveform] External audio decode failed:", err);
          externalAudioBuffer = null;
          drawFlatFallback(audioCanvas, audioCtx2d);
        }
      }

      function getTargetAudioTime() {
        return getGlobalVideoTime() - getOffset();
      }

      function syncAudioToVideo() {
        if (!audioFile || !audioUrl) return;

        const target = getTargetAudioTime();

        if (target < 0) {
          audioPlayer.pause();
          if (audioPlayer.currentTime !== 0) {
            audioPlayer.currentTime = 0;
          }
          return;
        }

        if (audioPlayer.duration && target > audioPlayer.duration) {
          audioPlayer.pause();
          return;
        }

        if (Math.abs(audioPlayer.currentTime - target) > 0.1) {
          audioPlayer.currentTime = target;
        }

        if (!videoPlayer.paused && audioPlayer.paused) {
          audioPlayer.play().catch((err) =>
            console.warn("External audio play blocked:", err)
          );
        } else if (videoPlayer.paused && !audioPlayer.paused) {
          audioPlayer.pause();
        }
      }

      function drawProgressOverlay(progressCanvas, progressCtx) {
        const total = getTotalDuration();
        if (!total) return;

        progressCtx.clearRect(0, 0, progressCanvas.width, progressCanvas.height);

        const progress = getGlobalVideoTime() / total;
        const progressX = progress * progressCanvas.width;

        progressCtx.fillStyle = "rgba(74, 158, 255, 0.3)";
        progressCtx.fillRect(0, 0, progressX, progressCanvas.height);

        progressCtx.fillStyle = "rgba(255, 255, 255, 0.8)";
        progressCtx.fillRect(progressX - 1, 0, 2, progressCanvas.height);
      }

      function animateProgressOverlay() {
        drawProgressOverlay(audioProgressCanvas, audioProgressCtx);
        requestAnimationFrame(animateProgressOverlay);
      }

      animateProgressOverlay();

      function revokeUrl(url) {
        if (url) URL.revokeObjectURL(url);
      }

      videoInput.addEventListener("change", async function () {
        const files = Array.from(this.files);
        if (files.length === 0) return;

        const startEmpty = videoQueue.length === 0;

        for (const file of files) {
          const url = URL.createObjectURL(file);
          const item = { file, url, name: file.name, duration: 0 };
          item.duration = await probeDuration(url);
          videoQueue.push(item);
        }

        updateQueueDisplay();

        if (startEmpty && videoQueue.length > 0) {
          loadQueueItem(0, true);
        } else {
          redrawExternalWaveform();
        }

        updateSyncButton();
        this.value = "";
      });

      audioInput.addEventListener("change", async function () {
        const file = this.files[0];
        if (!file) return;

        revokeUrl(audioUrl);
        audioFile = file;
        audioUrl = URL.createObjectURL(file);
        audioFileName.textContent = file.name;

        audioPlayer.src = audioUrl;
        audioPlayer.load();

        await renderExternalWaveform();
        syncAudioToVideo();
        updateSyncButton();
      });

      muteToggle.addEventListener("click", function () {
        videoMuted = !videoMuted;
        videoPlayer.muted = videoMuted;
        muteToggle.textContent = videoMuted ? "Unmute video audio" : "Mute video audio";
      });

      function adjustOffset(delta) {
        const current = getOffset();
        offsetControl.value = (current + delta).toFixed(2);
        redrawExternalWaveform();
        syncAudioToVideo();
      }

      offsetControl.addEventListener("input", function () {
        redrawExternalWaveform();
        syncAudioToVideo();
      });

      document.getElementById("offsetMinus1").addEventListener("click", () => adjustOffset(-1));
      document.getElementById("offsetMinus01").addEventListener("click", () => adjustOffset(-0.1));
      document.getElementById("offsetPlus01").addEventListener("click", () => adjustOffset(0.1));
      document.getElementById("offsetPlus1").addEventListener("click", () => adjustOffset(1));

      ["play", "pause", "seeked", "timeupdate", "ratechange"].forEach((event) => {
        videoPlayer.addEventListener(event, syncAudioToVideo);
      });

      videoPlayer.addEventListener("ended", playNext);

      audioCanvas.addEventListener("click", function (e) {
        if (!externalAudioBuffer) return;
        const rect = audioCanvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const shiftPx = getExternalWaveformShiftPx();
        const total = getTotalDuration();

        if (total > 0) {
          const globalTime = (x / rect.width) * total;
          seekToGlobalTime(globalTime);
          return;
        }

        const audioTimeAtClick = ((x - shiftPx) / rect.width) * externalAudioBuffer.duration;
        const globalTime = audioTimeAtClick + getOffset();
        seekToGlobalTime(globalTime);
      });

      function triggerDownload(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      syncDownload.addEventListener("click", async function () {
        if (videoQueue.length === 0 || !audioFile || isExporting) return;

        isExporting = true;
        updateSyncButton();
        setStatus("Preparing export\u2026");

        const offset = getOffset();
        const offsetStr = String(offset);
        const mountDir = "/input";
        const outputName = "synced.mp4";
        const audioName = safeFfmpegInputName(audioFile.name, ".mp3");
        const audioPath = `${mountDir}/${audioName}`;

        try {
          const ff = await getFFmpeg();

          const audioInputFile =
            audioFile.name === audioName
              ? audioFile
              : new File([audioFile], audioName, { type: audioFile.type });

          const mountFiles = [audioInputFile];
          const execArgs = ["-y"];

          if (videoQueue.length === 1) {
            const videoName = safeFfmpegInputName(videoQueue[0].file.name, ".mp4");
            const videoPath = `${mountDir}/${videoName}`;
            const videoInputFile =
              videoQueue[0].file.name === videoName
                ? videoQueue[0].file
                : new File([videoQueue[0].file], videoName, { type: videoQueue[0].file.type });
            mountFiles.unshift(videoInputFile);

            execArgs.push(
              "-i", videoPath,
              "-itsoffset", offsetStr,
              "-i", audioPath,
              "-map", "0:v:0",
              "-map", "1:a:0",
              "-c:v", "copy",
              "-c:a", "aac",
              "-b:a", "192k",
              "-shortest",
              "-movflags", "+faststart",
              outputName
            );
          } else {
          const mountFiles = videoQueue.map((item, index) => {
              const name = queueMountName(index, item.file);
              return item.file.name === name
                ? item.file
                : new File([item.file], name, { type: item.file.type });
            });
            mountFiles.push(audioInputFile);

            const concatLines = videoQueue.map(
              (item, index) => `file '${mountDir}/${queueMountName(index, item.file)}'`
            );

            const concatPath = `${mountDir}/concat.txt`;
            const concatContent = concatLines.join("\n");

            execArgs.push(
              "-f", "concat",
              "-safe", "0",
              "-i", concatPath,
              "-itsoffset", offsetStr,
              "-i", audioPath,
              "-map", "0:v:0",
              "-map", "1:a:0",
              "-c:v", "copy",
              "-c:a", "aac",
              "-b:a", "192k",
              "-shortest",
              "-movflags", "+faststart",
              outputName
            );

            ff.on("progress", ({ progress }) => {
              if (progress > 0) {
                setStatus(
                  `Joining ${videoQueue.length} clips and syncing audio\u2026 ${Math.round(progress * 100)}%`
                );
              }
            });

            await ff.createDir(mountDir);
            await ff.mount("WORKERFS", { files: mountFiles }, mountDir);
            await ff.writeFile(concatPath, concatContent);

            try {
              setStatus(`Joining ${videoQueue.length} clips and syncing audio\u2026`);
              await ff.exec(execArgs);

              const data = await ff.readFile(outputName);
              const blob = new Blob([data.buffer], { type: "video/mp4" });
              triggerDownload(blob, "synced.mp4");
              setStatus("Download started.");
              await ff.deleteFile(outputName);
              await ff.deleteFile(concatPath);
            } finally {
              await ff.unmount(mountDir);
              await ff.deleteDir(mountDir);
            }

            return;
          }

          ff.on("progress", ({ progress }) => {
            if (progress > 0) {
              setStatus(`Encoding\u2026 ${Math.round(progress * 100)}%`);
            }
          });

          await ff.createDir(mountDir);
          await ff.mount("WORKERFS", { files: mountFiles }, mountDir);

          try {
            setStatus("Running ffmpeg\u2026");
            await ff.exec(execArgs);

            const data = await ff.readFile(outputName);
            const blob = new Blob([data.buffer], { type: "video/mp4" });
            triggerDownload(blob, "synced.mp4");
            setStatus("Download started.");
            await ff.deleteFile(outputName);
          } finally {
            await ff.unmount(mountDir);
            await ff.deleteDir(mountDir);
          }
        } catch (err) {
          console.error(ts(), "[export] Failed:", err);
          setStatus(`Export failed: ${err.message || err}`, true);
        } finally {
          isExporting = false;
          updateSyncButton();
        }
      });
    </script>
  </body>
</html>
